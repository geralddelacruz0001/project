<header class="app-header">
  <button class="back-btn" onclick="goHome()">←</button>
  <h2>System Overview</h2>
</header>

<div class="app-content dash-container">
  <!-- Top Status Header -->
  <div class="dash-status">
    <span class="dash-dot"></span> Region North America • Portfolio Stats
  </div>

  <!-- Main Metric Cards -->
  <div class="dash-metrics-grid">
    <!-- CARD 1: PROJECTS -->
    <div class="dash-card">
      <div class="dash-card-top">
        <span class="dash-icon green">💼</span>
        <span class="dash-badge green" id="dashProjectStatus">Active</span>
      </div>
      <span class="dash-label">Total Projects</span>
      <span class="dash-value" id="dashProjectCount">--</span>
    </div>
    
    <!-- CARD 2: SKILLS -->
    <div class="dash-card">
      <div class="dash-card-top">
        <span class="dash-icon blue">⚙️</span>
        <span class="dash-badge blue" id="dashSkillStatus">Mastered</span>
      </div>
      <span class="dash-label">Skills Learned</span>
      <span class="dash-value" id="dashSkillCount">--</span>
    </div>
    
    <!-- CARD 3: GAME WINS -->
    <div class="dash-card">
      <div class="dash-card-top">
        <span class="dash-icon orange">🎮</span>
        <span class="dash-badge red" id="dashGameStatus">High Score</span>
      </div>
      <span class="dash-label">Game Wins</span>
      <span class="dash-value" id="dashGameWins">--</span>
    </div>
    
    <!-- CARD 4: NOTES -->
    <div class="dash-card">
      <div class="dash-card-top">
        <span class="dash-icon purple">📝</span>
        <span class="dash-badge green" id="dashNoteStatus">Saved</span>
      </div>
      <span class="dash-label">Notes Characters</span>
      <span class="dash-value" id="dashNoteChars">--</span>
    </div>
  </div>

  <!-- System Resources (Dynamic Skills) -->
  <div class="dash-panel">
    <div class="dash-panel-header">
      <h3>Top Skills</h3>
    </div>
    <div class="dash-resource-list" id="dashTopSkills">
      <div class="loading-spinner" style="margin: 10px auto;"></div>
    </div>
    <div class="dash-footer-bar">
      <span>Portfolio Readiness</span>
      <span class="dash-badge green" id="dashReadiness">Analyzing...</span>
    </div>
  </div>

  <!-- Recent Projects (Dynamic) -->
  <div class="dash-panel">
    <div class="dash-panel-header">
      <h3>Recent Projects</h3>
      <span class="dash-link" onclick="window.showScreen('projects')">View All</span>
    </div>
    <div class="dash-table" id="dashRecentProjects">
      <div class="loading-spinner" style="margin: 10px auto;"></div>
    </div>
  </div>

</div>
